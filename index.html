<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Med MCQ — Study Smarter</title>
  <meta name="description" content="MCQ practice for medical students with spaced repetition." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">🧬 Med MCQ</a>
    <nav class="crumbs" id="crumbs"></nav>
  </header>

  <main id="app" class="app"></main>

  <footer class="footer">
    <span>Built for med students · practice &amp; remember</span>
  </footer>

  <!-- Little love note: pink semi-circle tab on the right edge -->
  <button id="loveTab" class="love-tab" type="button" aria-label="A little note for you"></button>
  <div id="loveNote" class="love-note" role="dialog" aria-live="polite">i love you 💗 please study well</div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    (function () {
      const tab = document.getElementById("loveTab");
      const note = document.getElementById("loveNote");
      if (!tab || !note) return;
      let hideTimer;

      tab.addEventListener("click", function (e) {
        e.stopPropagation();
        tab.classList.remove("blink");           // stop nudging once seen
        const showing = note.classList.toggle("show");
        clearTimeout(hideTimer);
        if (showing) hideTimer = setTimeout(function () { note.classList.remove("show"); }, 6000);
      });

      // Tapping the note itself shouldn't dismiss it; tapping anywhere else does.
      note.addEventListener("click", function (e) { e.stopPropagation(); });
      document.addEventListener("click", function () { note.classList.remove("show"); });

      // Gently blink every 10 minutes to nudge a study break / reminder.
      function blink() {
        tab.classList.remove("blink");
        void tab.offsetWidth;                    // restart the CSS animation
        tab.classList.add("blink");
      }
      setInterval(blink, 10 * 60 * 1000);
    })();
  </script>
</body>
</html>
